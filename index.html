<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo FPS 3D com Arma e Braço</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      background: #000;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
    }
    #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
    #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
    }
    #ammo-box {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 25px;
      border-radius: 6px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="crosshair"></div>
  <div id="ui">
    <b>Clique na tela para travar o mouse e jogar</b><br>
    <b>W, A, S, D</b>: Movimentação<br>
    <b>Clique Esquerdo</b>: Atirar (com Recuo e Muzzle Flash)<br>
    <b>R</b>: Recarregar
  </div>
  <div id="ammo-box">MUNIÇÃO: <span id="ammo">30</span>/30</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 1. CENA E RENDERIZADOR
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1c23);
    scene.fog = new THREE.FogExp2(0x1a1c23, 0.012);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 2. ILUMINAÇÃO
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffeedd, 0.8);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    // 3. CENÁRIO
    const floorGeo = new THREE.PlaneGeometry(120, 120);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b2d35, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Inimigos/Alvos em 3D
    const targets = [];
    const targetGeo = new THREE.BoxGeometry(2, 4, 2);
    const targetMat = new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.3 });

    function createTarget(x, z) {
      const target = new THREE.Mesh(targetGeo, targetMat.clone());
      target.position.set(x, 2, z);
      target.castShadow = true;
      target.receiveShadow = true;
      scene.add(target);
      targets.push(target);
    }

    for (let i = 0; i < 10; i++) {
      createTarget((Math.random() - 0.5) * 80, -10 - Math.random() * 50);
    }

    // 4. MODELAGEM DO BRAÇO E DA ARMA (Parentados à Câmera)
    const weaponGroup = new THREE.Group();

    // Braço (Tonalidade de pele / luva tática)
    const armGeo = new THREE.CylinderGeometry(0.12, 0.15, 1.2, 16);
    const armMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 }); // Luva/Manga escura
    const arm = new THREE.Mesh(armGeo, armMat);
    arm.position.set(0.2, -0.3, -0.4);
    arm.rotation.set(Math.PI / 3, 0, -Math.PI / 8);
    weaponGroup.add(arm);

    // Corpo da Arma (Fuzil de Assalto)
    const bodyGeo = new THREE.BoxGeometry(0.15, 0.25, 1.2);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
    const gunBody = new THREE.Mesh(bodyGeo, gunMat);
    gunBody.position.set(0, 0, 0);
    weaponGroup.add(gunBody);

    // Cano da Arma
    const barrelGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.8, 16);
    const barrel = new THREE.Mesh(barrelGeo, gunMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.05, -0.8);
    weaponGroup.add(barrel);

    // Carregador (Pente de Munição)
    const magGeo = new THREE.BoxGeometry(0.1, 0.4, 0.2);
    const mag = new THREE.Mesh(magGeo, gunMat);
    mag.position.set(0, -0.25, -0.1);
    mag.rotation.x = Math.PI / 8;
    weaponGroup.add(mag);

    // Muzzle Flash (Fogo do Disparo)
    const flashGeo = new THREE.SphereGeometry(0.15, 8, 8);
    const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
    const muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
    muzzleFlash.position.set(0, 0.05, -1.2);
    weaponGroup.add(muzzleFlash);

    // Posiciona a arma em relação à câmera
    weaponGroup.position.set(0.35, -0.35, -0.6);
    camera.add(weaponGroup);
    scene.add(camera);

    // 5. CONTROLES E MECÂNICAS
    camera.position.set(0, 1.8, 0);
    let ammo = 30;
    let isReloading = false;

    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyR' && ammo < 30 && !isReloading) reload();
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    let isLocked = false;
    document.body.addEventListener('click', () => {
      if (!isLocked) document.body.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
    });

    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      euler.y -= e.movementX * 0.002;
      euler.x -= e.movementY * 0.002;
      euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
      camera.quaternion.setFromEuler(euler);
    });

    // Animações de Recuo (Recoil)
    let recoilOffset = 0;
    let recoilRotation = 0;

    const raycaster = new THREE.Raycaster();

    document.addEventListener('mousedown', (e) => {
      if (!isLocked || e.button !== 0 || ammo <= 0 || isReloading) return;

      ammo--;
      document.getElementById('ammo').innerText = ammo;

      // Animação de recuo
      recoilOffset = 0.15;
      recoilRotation = 0.1;

      // Muzzle flash
      flashMat.opacity = 1;
      setTimeout(() => flashMat.opacity = 0, 40);

      // Raycast do tiro
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(targets);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        hit.material.color.setHex(0xffffff);
        setTimeout(() => {
          hit.position.set((Math.random() - 0.5) * 80, 2, -10 - Math.random() * 50);
          hit.material.color.setHex(0xcc3333);
        }, 150);
      }
    });

    function reload() {
      isReloading = true;
      document.getElementById('ammo').innerText = '...';
      setTimeout(() => {
        ammo = 30;
        document.getElementById('ammo').innerText = ammo;
        isReloading = false;
      }, 1500);
    }

    // 6. LOOP DE ANIMAÇÃO
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isLocked) {
        // Movimentação do jogador
        const speed = 10.0 * delta;
        const move = new THREE.Vector3();
        if (keys['KeyW']) move.z -= 1;
        if (keys['KeyS']) move.z += 1;
        if (keys['KeyA']) move.x -= 1;
        if (keys['KeyD']) move.x += 1;

        move.normalize();
        move.applyQuaternion(camera.quaternion);
        move.y = 0;
        camera.position.addScaledVector(move, speed);

        // Animação de balanço da arma ao andar (Sway/Bobbing)
        const time = clock.getElapsedTime();
        if (move.length() > 0) {
          weaponGroup.position.y = -0.35 + Math.sin(time * 10) * 0.02;
          weaponGroup.position.x = 0.35 + Math.cos(time * 5) * 0.01;
        } else {
          weaponGroup.position.y = -0.35 + Math.sin(time * 2) * 0.005;
        }

        // Recuperação do recuo (Recoil recovery)
        recoilOffset = THREE.MathUtils.lerp(recoilOffset, 0, delta * 15);
        recoilRotation = THREE.MathUtils.lerp(recoilRotation, 0, delta * 15);

        weaponGroup.position.z = -0.6 + recoilOffset;
        weaponGroup.rotation.x = recoilRotation;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
