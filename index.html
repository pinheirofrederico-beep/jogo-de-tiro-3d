<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FPS Online 3D Realista</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; color: #fff; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 2px solid #fff; border-radius: 50%; pointer-events: none; z-index: 10; }
    #net-ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; z-index: 20; border: 1px solid #333; }
    input, button { padding: 8px 12px; margin: 5px 0; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; }
    button { cursor: pointer; background: #0066cc; }
    button:hover { background: #0055aa; }
    #hud { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; border: 1px solid #333; }
  </style>
</head>
<body>

  <div id="crosshair"></div>
  
  <div id="net-ui">
    <h3 style="margin-top:0;">MULTIPLAYER ONLINE (P2P)</h3>
    <div>Seu ID: <b id="my-id" style="color:#00ccff;">Gerando...</b></div>
    <hr style="border-color:#444;">
    <input type="text" id="peer-id-input" placeholder="Cole o ID do outro jogador">
    <button id="connect-btn">Conectar à Partida</button>
    <div id="status" style="color: #ffcc00; margin-top: 5px;">Aguardando conexão...</div>
  </div>

  <div id="hud">MUNIÇÃO: <span id="ammo">30</span>/30</div>

  <!-- Bibliotecas externas via CDN: Three.js, GLTFLoader para 3D e PeerJS para Online -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    // 1. CENA, CÂMERA E RENDERIZADOR
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111318);
    scene.fog = new THREE.FogExp2(0x111318, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // Iluminação
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(20, 40, 20);
    light.castShadow = true;
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // Chão
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ color: 0x22252c, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 2. CARREGAMENTO DE MODELO 3D REALISTA (GLTF)
    const loader = new THREE.GLTFLoader();
    const weaponGroup = new THREE.Group();
    camera.add(weaponGroup);
    scene.add(camera);
    camera.position.set(0, 1.7, 0);

    // Exemplo de carregamento de modelo GLTF da web
    loader.load('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/FPS_Weapon/glTF/FPS_Weapon.gltf', (gltf) => {
      const model = gltf.scene;
      model.scale.set(0.5, 0.5, 0.5);
      model.position.set(0.2, -0.3, -0.5);
      weaponGroup.add(model);
    }, undefined, (error) => {
      // Fallback simples se o asset externo falhar o carregamento
      const fallbackBox = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.6), new THREE.MeshStandardMaterial({color: 0x222222}));
      fallbackBox.position.set(0.2, -0.2, -0.4);
      weaponGroup.add(fallbackBox);
    });

    // 3. MULTIPLAYER ONLINE COM PEERJS (WebRTC)
    const peer = new Peer(); // Conecta ao servidor de sinalização do PeerJS
    let conn = null;
    const remotePlayers = {};

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
    });

    peer.on('connection', (connection) => {
      conn = connection;
      setupNetworkHandlers();
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      const remoteId = document.getElementById('peer-id-input').value.trim();
      if (remoteId) {
        conn = peer.connect(remoteId);
        setupNetworkHandlers();
      }
    });

    function setupNetworkHandlers() {
      document.getElementById('status').innerText = 'ONLINE - CONECTADO!';
      document.getElementById('status').style.color = '#00ff66';

      // Avatar 3D para o jogador remoto
      const otherPlayer = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.4, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x0088ff, roughness: 0.3 })
      );
      otherPlayer.castShadow = true;
      scene.add(otherPlayer);
      remotePlayers['peer'] = otherPlayer;

      conn.on('data', (data) => {
        if (data.type === 'move') {
          otherPlayer.position.set(data.x, data.y, data.z);
          otherPlayer.rotation.y = data.rotY;
        }
      });
    }

    // 4. CONTROLES E SINCRONIZAÇÃO EM TEMPO REAL
    let isLocked = false;
    document.body.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
        document.body.requestPointerLock();
      }
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
    });

    const keys = {};
    document.addEventListener('keydown', (e) => keys[e.code] = true);
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      euler.y -= e.movementX * 0.002;
      euler.x -= e.movementY * 0.002;
      euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
      camera.quaternion.setFromEuler(euler);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isLocked) {
        const move = new THREE.Vector3();
        if (keys['KeyW']) move.z -= 1;
        if (keys['KeyS']) move.z += 1;
        if (keys['KeyA']) move.x -= 1;
        if (keys['KeyD']) move.x += 1;

        move.normalize().applyQuaternion(camera.quaternion);
        move.y = 0;
        camera.position.addScaledVector(move, 8 * delta);

        // Envia posição/rotação via WebRTC para o outro jogador online
        if (conn && conn.open) {
          conn.send({
            type: 'move',
            x: camera.position.x,
            y: camera.position.y - 0.8,
            z: camera.position.z,
            rotY: euler.y
          });
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
