<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo FPS 3D Realista</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      background: #000;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
    #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
    }
    #ammo-box {
      position: absolute;
      bottom: 25px;
      right: 25px;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 26px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="crosshair"></div>
  <div id="ui">
    <b style="font-size: 15px; color: #ffcc00;">CONTROLES</b><br>
    • <b>Clique na tela</b> para ativar a mira no mouse<br>
    • <b>W, A, S, D</b>: Movimentar<br>
    • <b>Clique Esquerdo</b>: Atirar<br>
    • <b>R</b>: Recarregar
  </div>
  <div id="ammo-box">MUNIÇÃO: <span id="ammo">30</span>/30</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 1. CENA, CÂMERA E RENDERIZADOR
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111318);
    scene.fog = new THREE.FogExp2(0x111318, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    // 2. ILUMINAÇÃO
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.2);
    sun.position.set(40, 60, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 150;
    const d = 50;
    sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
    sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
    scene.add(sun);

    // 3. CENÁRIO (Chão texturizado + Obstáculos)
    function createGridTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#22252e';
      ctx.fillRect(0,0,256,256);
      ctx.strokeStyle = '#333846';
      ctx.lineWidth = 4;
      ctx.strokeRect(0,0,256,256);
      return new THREE.CanvasTexture(canvas);
    }

    const floorTexture = createGridTexture();
    floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(40, 40);

    const floorGeo = new THREE.PlaneGeometry(200, 200);
    const floorMat = new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.8, metalness: 0.2 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Obstáculos (Caixas metálicas)
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x3a4050, roughness: 0.5, metalness: 0.5 });
    const boxes = [];
    for (let i = 0; i < 20; i++) {
      const h = 2 + Math.random() * 3;
      const box = new THREE.Mesh(new THREE.BoxGeometry(3, h, 3), boxMat);
      box.position.set((Math.random() - 0.5) * 80, h / 2, (Math.random() - 0.5) * 80);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
      boxes.push(box);
    }

    // Alvos 3D (Bonecos de treino)
    const targets = [];
    const targetMat = new THREE.MeshStandardMaterial({ color: 0xc93b3b, roughness: 0.4 });
    function createTarget(x, z) {
      const group = new THREE.Group();
      
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.4), targetMat);
      body.position.y = 1.3;
      body.castShadow = true;
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), targetMat);
      head.position.y = 2.3;
      head.castShadow = true;
      group.add(head);

      const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5), boxMat);
      stand.position.y = 0.25;
      group.add(stand);

      group.position.set(x, 0, z);
      scene.add(group);
      targets.push(group);
    }

    for (let i = 0; i < 12; i++) {
      createTarget((Math.random() - 0.5) * 70, -10 - Math.random() * 60);
    }

    // 4. MODELAGEM DA ARMA E DO BRAÇO (Parentados à Câmera)
    const weaponGroup = new THREE.Group();
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1d, metalness: 0.85, roughness: 0.25 });
    const armMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.7 }); // Luva/manga tática

    // Braço direito
    const armGeo = new THREE.CylinderGeometry(0.11, 0.14, 1.1, 12);
    const arm = new THREE.Mesh(armGeo, armMat);
    arm.position.set(0.18, -0.32, -0.35);
    arm.rotation.set(Math.PI / 2.8, -0.2, -0.3);
    weaponGroup.add(arm);

    // Fuzil - Corpo
    const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 0.9), gunMat);
    weaponGroup.add(gunBody);

    // Fuzil - Cano
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.7, 12), gunMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.03, -0.75);
    weaponGroup.add(barrel);

    // Fuzil - Pente
    const mag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.15), gunMat);
    mag.position.set(0, -0.2, -0.05);
    mag.rotation.x = Math.PI / 8;
    weaponGroup.add(mag);

    // Fuzil - Mira / Trilo
    const scope = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.3), gunMat);
    scope.position.set(0, 0.12, -0.1);
    weaponGroup.add(scope);

    // Muzzle Flash
    const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa11, transparent: true, opacity: 0 });
    const muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), flashMat);
    muzzleFlash.position.set(0, 0.03, -1.15);
    weaponGroup.add(muzzleFlash);

    // Posiciona em 1ª pessoa
    weaponGroup.position.set(0.32, -0.32, -0.55);
    camera.add(weaponGroup);
    scene.add(camera);

    // 5. LÓGICA E CONTROLES DE JOGO
    camera.position.set(0, 1.7, 0);

    let ammo = 30;
    let isReloading = false;
    let isLocked = false;
    const keys = {};

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyR' && ammo < 30 && !isReloading) reload();
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    document.body.addEventListener('click', () => {
      if (!isLocked) document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      document.getElementById('ui').style.opacity = isLocked ? '0.3' : '1';
    });

    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      euler.y -= e.movementX * 0.002;
      euler.x -= e.movementY * 0.002;
      euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
      camera.quaternion.setFromEuler(euler);
    });

    // Partículas de Impacto
    const impactParticles = [];
    function createImpactEffect(pos) {
      for (let i = 0; i < 6; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.03, 4, 4),
          new THREE.MeshBasicMaterial({ color: 0xffcc44 })
        );
        p.position.copy(pos);
        p.userData = {
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 3,
            Math.random() * 3,
            (Math.random() - 0.5) * 3
          ),
          life: 0.3
        };
        scene.add(p);
        impactParticles.push(p);
      }
    }

    // Coice da Arma
    let recoilOffset = 0;
    let recoilRot = 0;

    const raycaster = new THREE.Raycaster();
    const shootables = [...boxes, floor];
    targets.forEach(t => t.children.forEach(child => shootables.push(child)));

    document.addEventListener('mousedown', (e) => {
      if (!isLocked || e.button !== 0 || ammo <= 0 || isReloading) return;

      ammo--;
      document.getElementById('ammo').innerText = ammo;

      // Efeitos Visuais do Disparo
      recoilOffset = 0.12;
      recoilRot = 0.1;
      flashMat.opacity = 1;
      setTimeout(() => flashMat.opacity = 0, 35);

      // Raycast do tiro
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(shootables);

      if (intersects.length > 0) {
        const hit = intersects[0];
        createImpactEffect(hit.point);

        // Se acertar um alvo
        let obj = hit.object;
        while (obj.parent && obj.parent !== scene) {
          if (targets.includes(obj.parent)) {
            const targetGroup = obj.parent;
            targetGroup.position.set((Math.random() - 0.5) * 70, 0, -10 - Math.random() * 60);
            break;
          }
          obj = obj.parent;
        }
      }
    });

    function reload() {
      isReloading = true;
      document.getElementById('ammo').innerText = '...';
      setTimeout(() => {
        ammo = 30;
        document.getElementById('ammo').innerText = ammo;
        isReloading = false;
      }, 1400);
    }

    // 6. LOOP DE ANIMAÇÃO
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (isLocked) {
        // Movimento do Jogador
        const speed = 10.0 * delta;
        const move = new THREE.Vector3();
        if (keys['KeyW']) move.z -= 1;
        if (keys['KeyS']) move.z += 1;
        if (keys['KeyA']) move.x -= 1;
        if (keys['KeyD']) move.x += 1;

        move.normalize().applyQuaternion(camera.quaternion);
        move.y = 0;
        camera.position.addScaledVector(move, speed);

        // Balanço da arma (Sway) ao andar
        if (move.length() > 0) {
          weaponGroup.position.y = -0.32 + Math.sin(time * 10) * 0.012;
          weaponGroup.position.x = 0.32 + Math.cos(time * 5) * 0.008;
        } else {
          weaponGroup.position.y = -0.32 + Math.sin(time * 2) * 0.002;
        }

        // Recuperação do recuo
        recoilOffset = THREE.MathUtils.lerp(recoilOffset, 0, delta * 18);
        recoilRot = THREE.MathUtils.lerp(recoilRot, 0, delta * 18);
        weaponGroup.position.z = -0.55 + recoilOffset;
        weaponGroup.rotation.x = recoilRot;
      }

      // Atualizar Partículas
      for (let i = impactParticles.length - 1; i >= 0; i--) {
        const p = impactParticles[i];
        p.userData.life -= delta;
        if (p.userData.life <= 0) {
          scene.remove(p);
          impactParticles.splice(i, 1);
        } else {
          p.position.addScaledVector(p.userData.vel, delta);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
